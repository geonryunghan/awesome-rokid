name: Build selected Rokid APKs

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-selected-rokid-apks.yml"
      - "apk-build/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.project }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: rokid-gmaps
            repository: Anezium/Rokid-GMaps
            ref: f8598518670133d38bec685fb6708af5553fb529
            tasks: assembleDebug
            submodules: "false"
          - project: rokid-maps
            repository: chartmann1590/Rokid-Maps
            ref: 3542db3b47a5995739025a0c1874df3d59f7f1c9
            tasks: assembleDebug
            submodules: "false"
          - project: assistbridge
            repository: Anezium/AssistBridge
            ref: 7b180625e899a86293184b8535131f95ca7e9d2b
            tasks: ":phone-app:assembleRelease :glasses-app:assembleRelease"
            submodules: "true"

    steps:
      - name: Clone pinned upstream source
        shell: pwsh
        run: |
          git clone --no-checkout "https://github.com/${{ matrix.repository }}.git" src
          Set-Location src
          git fetch --depth 1 origin ${{ matrix.ref }}
          git checkout --detach ${{ matrix.ref }}
          if ("${{ matrix.submodules }}" -eq "true") {
            git submodule update --init --recursive
          }
          git rev-parse HEAD

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android API 34 is available
        shell: pwsh
        run: |
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT"

          $cmd = Get-Command sdkmanager.bat -ErrorAction SilentlyContinue
          if ($cmd) {
            $sdkmanager = $cmd.Source
          } else {
            $roots = @($env:ANDROID_HOME, $env:ANDROID_SDK_ROOT) | Where-Object { $_ }
            $sdkmanager = $null
            foreach ($root in $roots) {
              $candidate = Get-ChildItem -Path (Join-Path $root "cmdline-tools") -Recurse -Filter sdkmanager.bat -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending |
                Select-Object -First 1
              if ($candidate) {
                $sdkmanager = $candidate.FullName
                break
              }
            }
          }

          if (-not $sdkmanager) { throw "sdkmanager.bat not found on the hosted runner." }
          Write-Host "Using sdkmanager: $sdkmanager"
          & $sdkmanager "platforms;android-34" "build-tools;34.0.0"
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed with exit code $LASTEXITCODE" }

      - name: Build APKs
        shell: pwsh
        working-directory: src
        run: |
          .\gradlew.bat ${{ matrix.tasks }} --no-daemon --stacktrace

      - name: Collect APKs and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $apks = Get-ChildItem -Path src -Recurse -Filter *.apk | Where-Object { $_.FullName -match '[\\/]build[\\/]outputs[\\/]apk[\\/]' }
          if (-not $apks) { throw "No APK files were produced." }
          foreach ($apk in $apks) {
            $target = Join-Path dist ("${{ matrix.project }}-" + $apk.Name)
            Copy-Item $apk.FullName $target
          }
          $lines = Get-ChildItem dist -Filter *.apk | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii (Join-Path dist "SHA256SUMS.txt")
          Get-ChildItem dist | Format-Table Name,Length

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-builds-${{ matrix.project }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
